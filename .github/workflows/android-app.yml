# Baut aus den Web-Dateien die Android-App (APK) und stellt sie unter „Releases“ zum Herunterladen bereit.
# Läuft automatisch nach jedem Hochladen von Dateien und kann unter „Actions“ auch von Hand gestartet werden.
# Download-Adresse der jeweils neuesten App:
#   https://github.com/<Benutzer>/<Repo>/releases/latest/download/Esstagebuch.apk
name: Android-App bauen

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Web-Dateien in die App übernehmen
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html foods.js bls.js manifest.json icon-192.png android/app/src/main/assets/www/
          VERSION=$(grep -oP 'APP_VERSION = "\K[0-9.]+' index.html)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App-Version: $VERSION"

      - name: APK bauen
        run: gradle -p android assembleRelease -PappVersion="$VERSION" --no-daemon --stacktrace

      - name: APK bereitstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Esstagebuch.apk
          gh release create "app-${VERSION}-build${GITHUB_RUN_NUMBER}" Esstagebuch.apk \
            --title "Esstagebuch ${VERSION} (Build ${GITHUB_RUN_NUMBER})" \
            --notes "Android-App. Auf dem Handy herunterladen und installieren. Updates einfach darüber installieren – die Daten bleiben erhalten." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Esstagebuch-APK
          path: Esstagebuch.apk
